<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; font-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' data: blob: https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval';" />
    <link rel="icon" type="image/png" href="./assets/icon-EAInt3Kl.png" />
    <title>Dubber Studio - Web Voice Cloning & AI Dubbing Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Battambang:wght@400;700&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
      body { margin: 0; background: #08090b; font-family: 'Kantumruy Pro', 'Inter', system-ui, sans-serif; }
      .boot-veil { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: 'Outfit', 'Kantumruy Pro', system-ui, sans-serif; color: #f7f5f0;
        background:
          radial-gradient(640px 420px at 32% 18%, #f2c14e14, transparent 70%),
          radial-gradient(560px 380px at 74% 85%, #e9a13c0f, transparent 70%),
          #08090b; }
      .boot-veil img { height: 140px; width: auto; filter: drop-shadow(0 14px 26px #000a);
        animation: boot-bob .5s cubic-bezier(.4, 0, .5, 1) infinite; }
      .boot-veil div { display: flex; align-items: flex-end; gap: 5px; height: 26px; }
      .boot-veil i { width: 5px; height: 100%; border-radius: 3px; transform-origin: 50% 100%;
        background: linear-gradient(#f2c14e, #e0a322); animation: boot-bar 1s ease-in-out infinite; }
      .boot-veil i:nth-child(2) { animation-duration: .95s; }
      .boot-veil i:nth-child(3) { animation-duration: .74s; }
      .boot-veil i:nth-child(4) { animation-duration: 1.13s; }
      .boot-veil i:nth-child(5) { animation-duration: .83s; }
      .boot-veil p { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
      .boot-veil p span { color: #f2c14e; text-shadow: 0 0 20px rgba(242, 193, 78, 0.4); }
      .boot-veil .subtag { font-size: 13px; font-weight: 600; opacity: 0.7; letter-spacing: 1px; text-transform: uppercase; margin-top: -8px; }

      @media (prefers-color-scheme: light) {
        body { background: #F9FAFB; }
        .boot-veil { color: #0B1017;
          background:
            radial-gradient(640px 420px at 32% 18%, #f2c14e1f, transparent 70%),
            radial-gradient(560px 380px at 74% 85%, #e9a13c14, transparent 70%),
            #F9FAFB; }
        .boot-veil img { filter: drop-shadow(0 14px 26px #0B101726); }
      }
      html[data-theme="light"] body { background: #F9FAFB; }
      html[data-theme="light"] .boot-veil { color: #0B1017;
        background:
          radial-gradient(640px 420px at 32% 18%, #f2c14e1f, transparent 70%),
          radial-gradient(560px 380px at 74% 85%, #e9a13c14, transparent 70%),
          #F9FAFB; }
      html[data-theme="light"] .boot-veil img { filter: drop-shadow(0 14px 26px #0B101726); }
      html[data-theme="dark"] body { background: #08090b; }
      html[data-theme="dark"] .boot-veil { color: #f7f5f0;
        background:
          radial-gradient(640px 420px at 32% 18%, #f2c14e14, transparent 70%),
          radial-gradient(560px 380px at 74% 85%, #e9a13c0f, transparent 70%),
          #08090b; }
      html[data-theme="dark"] .boot-veil img { filter: drop-shadow(0 14px 26px #000a); }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-9px) rotate(1.2deg); } }
      @keyframes boot-bar { 0%, 100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-veil img { animation: none; }
        .boot-veil i { animation: none; transform: scaleY(.55); }
      }
    </style>

    <!-- 1. Standalone Browser Bridge (Mock IPC & Voice Engine) must load first -->
    <script src="./desktop-web-bridge.js"></script>

    <!-- 2. Main React Web Application Bundle -->
    <script type="module" crossorigin src="./assets/index-Bs5qzE0C.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BQmrldh6.css">
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-veil" id="boot-veil">
      <img src="./assets/icon-EAInt3Kl.png" alt="Dubber Studio" />
      <div><i></i><i></i><i></i><i></i><i></i></div>
      <p>Dubber <span>Studio</span></p>
      <div class="subtag">Web Voice Cloning & AI Dubbing Platform</div>
    </div>
  </body>
</html>
